name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" -o key-daemon-linux-amd64 ./cmd/key-daemon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" -o key-daemon-linux-arm64 ./cmd/key-daemon

      - name: Create checksums
        run: |
          sha256sum key-daemon-linux-* > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            key-daemon-linux-amd64
            key-daemon-linux-arm64
            checksums.txt
          generate_release_notes: true
