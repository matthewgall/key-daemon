name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
          - '386'
          - arm
          - ppc64le
          - s390x
          - riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags "-X main.version=${GITHUB_REF_NAME} -s -w" -o key-daemon-linux-${{ matrix.goarch }} ./cmd/key-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-daemon-linux-${{ matrix.goarch }}
          path: key-daemon-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: key-daemon-linux-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum key-daemon-linux-* > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/key-daemon-linux-*
            artifacts/checksums.txt
          generate_release_notes: true
